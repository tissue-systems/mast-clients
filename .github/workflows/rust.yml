name: rust

on:
  push:
    paths:
      - rust/**
      - .github/workflows/rust.yml
  pull_request:
    paths:
      - rust/**
      - .github/workflows/rust.yml

defaults:
  run:
    working-directory: rust

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The transport is swappable, so the crate has to build without the
      # bundled one.
      - run: cargo build --no-default-features

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      # The lockfile only governs this repo's tests, but a vulnerable pin in it
      # is still a vulnerable pin on every CI run and contributor machine.
      - run: cargo install cargo-audit --locked
      - run: cargo audit
